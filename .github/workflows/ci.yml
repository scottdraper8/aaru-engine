name: Checks

on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          disable-sudo-and-containers: ${{ runner.os == 'Linux' }}
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action revision
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
      - name: Install the required external hook framework from exact hashes
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-precommit.txt
      - name: Run every pre-commit gate
        run: python -m pre_commit run --all-files --show-diff-on-failure

  supply-chain:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action revision
        with:
          toolchain: 1.98.1
      - name: Install pinned advisory and dependency-policy tools
        run: |
          cargo install --locked --version 0.22.2 cargo-audit
          cargo install --locked --version 0.20.2 cargo-deny
      - name: Reject vulnerabilities and advisory warnings
        run: cargo audit --deny warnings
      - name: Enforce dependency sources and licenses
        run: cargo deny --locked check

  quality:
    name: Quality gate
    if: ${{ always() }}
    needs: [native, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action revision
        with:
          toolchain: 1.98.1
      - name: Require every prerequisite to succeed
        run: cargo run --locked --quiet -p aaru-repo-policy -- ci-gate
        env:
          AARU_CI_NEEDS: ${{ toJSON(needs) }}
