[workspace]
members = ["crates/*", "tools/repo-policy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE.md"
publish = false

[workspace.dependencies]
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
sha2 = "=0.11.1"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
toml = "=1.1.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
